<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123c30" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
    <meta name="description" content="BioSfere — biyolojik gözlem, ortak harita ve vatandaş bilimi platformu." />
    <title>BioSfere — Canlı Gözlem Ağı</title>
    <script>
      (() => {
        let language = /^tr(?:-|$)/i.test(navigator.language || "") ? "tr" : "en";
        try {const saved = localStorage.getItem("biosfere_session") && localStorage.getItem("biosfere_locale_current"); if (saved === "tr" || saved === "en") language = saved;} catch {}
        document.documentElement.lang = language;
        if (language === "en") {
          document.title = "BioSfere — Biodiversity Observations";
          document.querySelector('meta[name="description"]').content = "BioSfere — biodiversity observations, a shared map and citizen science.";
        }
      })();
    </script>
    <style id="biosfere-startup-styles">
      html,body{margin:0}
      .biosfere-startup{box-sizing:border-box;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 20px;background:#f4f7f4;color:#123c30;text-align:center}
      .biosfere-startup-brand{display:flex;align-items:center;gap:18px}
      .biosfere-startup-mark{display:grid;place-items:center;flex-shrink:0;width:76px;height:76px;border:1px solid #b7d0bf;border-radius:50%;background:#e7f0e8}
      .biosfere-startup-mark svg{width:46px;height:46px;overflow:visible}
      .biosfere-startup-leaf{transform-origin:7px 15px;animation:biosfere-leaf-rejoin 2.2s cubic-bezier(.45,0,.25,1) infinite}
      .biosfere-startup-word{font-family:Lora,Georgia,serif;font-size:42px;font-weight:600;letter-spacing:-1.6px;line-height:1.2}
      .biosfere-startup-word em{font-weight:500}
      .biosfere-startup-label{margin:0;font:400 15px/1.6 'Fira Sans',Arial,sans-serif;letter-spacing:.02em;color:#536b5d}
      .biosfere-startup-retry{min-height:44px;border:1px solid #b7d0bf;border-radius:999px;padding:10px 22px;background:white;color:#123c30;font:600 14px/1.5 'Fira Sans',Arial,sans-serif;cursor:pointer}
      .biosfere-startup-retry:focus-visible{outline:2px solid #007f24;outline-offset:3px}
      @keyframes biosfere-leaf-rejoin{0%,18%,100%{transform:translate(0,0) rotate(0deg)}43%,58%{transform:translate(5px,-6px) rotate(13deg)}82%{transform:translate(0,0) rotate(0deg)}}
      @media(max-width:380px){.biosfere-startup-mark{width:64px;height:64px}.biosfere-startup-mark svg{width:40px;height:40px}.biosfere-startup-word{font-size:35px}.biosfere-startup-brand{gap:14px}}
      @media(prefers-reduced-motion:reduce){.biosfere-startup-leaf{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="biosfere-startup" role="status" aria-live="polite">
        <div class="biosfere-startup-brand" aria-hidden="true">
          <span class="biosfere-startup-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21c0-3 1.85-5.36 5.08-6"/><g class="biosfere-startup-leaf"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M7.08 15C9.5 14.52 12 13 13 12"/></g></svg></span>
          <span class="biosfere-startup-word">Bio<em>Sfere</em></span>
        </div>
        <p class="biosfere-startup-label">BioSfere açılıyor…</p>
        <noscript>BioSfere'yi açmak için tarayıcında JavaScript'i etkinleştir.</noscript>
      </div>
    </div>
    <script>if (document.documentElement.lang === "en") document.querySelector(".biosfere-startup-label").textContent = "Opening BioSfere…";</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
